<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<title>MAX</title>
<style>
:root{
  --bg:#0d1017; --panel:#151a24; --panel2:#1a2130; --line:#232c3d; --line2:#313d55;
  --fg:#e8edf5; --dim:#93a0b8; --acc:#2fbf71; --acc2:#5f7cff; --amber:#f5b93c; --red:#f26d6d;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);display:flex;flex-direction:column;overscroll-behavior:none}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#2b3548;border-radius:6px;border:2px solid var(--bg)}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px clamp(12px,3vw,24px);border-bottom:1px solid var(--line);background:#0b0e14;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.3px;min-width:0}
.logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#0f9f5f);color:#06281a;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.brand b{font-size:15px}
.meta{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.dot.ok{background:var(--acc)}
.dot.err{background:var(--red)}
.chip{border:1px solid var(--line);background:var(--panel);padding:2px 9px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
#cwd{font-family:var(--mono);font-size:11px;max-width:40vw}
main{flex:1;overflow-y:auto;scroll-behavior:smooth}
.inner{max-width:min(920px,100%);margin:0 auto;padding:16px clamp(12px,3vw,24px)}
.msg{display:flex;gap:10px;margin:0 0 14px;animation:fade .15s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.av{width:27px;height:27px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:3px;user-select:none}
.msg.user{flex-direction:row-reverse}
.msg.user .av{background:var(--acc2);color:#0c1130}
.msg.assistant .av{background:linear-gradient(135deg,#128f58,#0e6f46);color:#d9fff0}
.bubble{max-width:min(78%,760px);padding:8px 13px;border-radius:13px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:#1b2140;border-color:#2a3560}
.bubble.reason{color:var(--dim);font-style:italic;font-size:13px;background:transparent;border-style:dashed}
.bubble.err{color:#ff9a9a;border-color:#5f2b33;background:#241318}
.typing{display:inline-flex;gap:4px;align-items:center;padding:5px 2px;vertical-align:middle}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:td 1.1s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes td{0%,100%{opacity:.25}50%{opacity:1}}
#pending{flex:0 0 auto;width:100%;max-width:min(920px,100%);margin:0 auto;padding:0 clamp(12px,3vw,24px) 6px}
.tool{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:8px 10px;margin:6px 0 9px;font-size:13px;flex-wrap:wrap}
.tool .tag{flex:none;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.2px}
.tag.rw{background:#3b2b0a;color:var(--amber);border:1px solid #5a4416}
.tag.ro{background:#0e3322;color:#54d98f;border:1px solid #1c5e3d}
.tool code{color:var(--fg);overflow-wrap:anywhere;flex:1 1 auto;min-width:120px;font:12px/1.5 var(--mono);background:#0d1117;padding:5px 9px;border-radius:7px;border:1px solid var(--line)}
.tool .st{font-size:12px;color:var(--dim);margin-left:auto;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tool .st.running::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--amber);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tool .acts{display:flex;gap:8px;margin-left:auto}
.tool button{border:0;border-radius:9px;padding:9px 18px;font:600 13px var(--sans);cursor:pointer;min-height:38px;transition:filter .12s}
.tool button.ok{background:var(--acc);color:#052b18}
.tool button.no{background:#3a1a1a;color:#ffb0b0;border:1px solid #5f2b33}
.tool button.ok:active,.tool button.no:active{filter:brightness(1.25)}
details.out{margin:0 0 9px;background:#0b0f16;border:1px solid var(--line);border-radius:11px;overflow:hidden}
details.out summary{cursor:pointer;padding:8px 12px;color:var(--dim);font-size:12px;font-weight:600}
details.out pre{max-height:300px;overflow:auto;padding:10px 12px;margin:0;font:12px/1.5 var(--mono);color:#b6c6e3;white-space:pre-wrap}
footer{flex:0 0 auto;border-top:1px solid var(--line);padding:10px clamp(12px,3vw,24px) calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.bar{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--line2);color:var(--fg);border-radius:12px;padding:12px 14px;font:14px/1.5 var(--sans);outline:none;max-height:180px;min-height:46px;box-shadow:0 0 0 0 transparent;transition:border-color .12s}
textarea:focus{border-color:var(--acc)}
textarea::placeholder{color:var(--dim)}
#send{flex:none;height:46px;padding:0 24px;border:0;border-radius:12px;background:var(--acc);color:#052b18;font:700 14px var(--sans);cursor:pointer;transition:filter .12s}
#send:hover:not(:disabled){filter:brightness(1.1)}
#send:disabled{opacity:.45;cursor:default}
.hint{max-width:min(920px,100%);margin:6px auto 0;font-size:11px;color:var(--dim)}
.logo-fallback{display:none}
@media (max-width:560px){
  #model,.meta .chip{margin:0}
  header{gap:8px;padding-top:8px;padding-bottom:8px}
  .chip{font-size:11px;max-width:30vw}
  textarea{font-size:16px}
  .bubble{max-width:100%;font-size:15px}
  .tool .acts{width:100%;margin-left:0}
  .tool button{flex:1}
  .hint{display:none}
  .brand b{font-size:14px}
}
@media (min-width:1025px){
  body{font-size:15px}
  .inner{padding-top:22px}
  .bubble{padding:10px 15px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">M</span><b>MAX</b></div>
  <div class="meta">
    <span id="status" class="dot"></span>
    <span class="chip" id="model">conectando…</span>
    <span class="chip" id="cwd" hidden></span>
  </div>
</header>
<main id="scroller"><div class="inner" id="log"></div></main>
<div id="pending"></div>
<footer>
  <div class="bar inner" style="max-width:min(920px,100%);padding:0">
    <textarea id="input" rows="1" placeholder="Preguntá o mandá una tarea…" autocomplete="off"></textarea>
    <button id="send" disabled>Enviar</button>
  </div>
  <p class="hint">Enter envía · Shift+Enter salto de línea</p>
</footer>
<script>
const scroller=document.getElementById('scroller'),log=document.getElementById('log'),
      pend=document.getElementById('pending'),inp=document.getElementById('input'),
      sendbtn=document.getElementById('send'),modelEl=document.getElementById('model'),
      cwdEl=document.getElementById('cwd'),statusEl=document.getElementById('status');
let session=null,busy=false,ty=null;
const history=[];

function mk(tag,cls,text){
  const n=document.createElement(tag);
  if(cls)n.className=cls;
  if(text!=null)n.textContent=text;
  return n;
}
function scroll(){scroller.scrollTop=scroller.scrollHeight;}
function truncate(s,n){if(s&&s.length>n)return s.slice(0,n)+' …';return s||'';}

function bubble(who,cls){
  const msg=document.createElement('div');
  msg.className='msg '+who+(cls?' '+cls:'');
  msg.appendChild(mk('span','av',who==='user'?'T':'M'));
  const b=mk('div','bubble');
  if(cls)b.classList.add(cls);
  msg.appendChild(b);
  log.appendChild(msg);
  scroll();
  return b;
}
function appendMsg(text,who){
  bubble(who).textContent=text;
}
function streamStart(){
  const b=bubble('assistant');
  ty=mk('span','typing');
  ty.innerHTML='<i></i><i></i><i></i>';
  b.appendChild(ty);
  return b;
}
function streamToken(b,t){
  if(ty)b.insertBefore(document.createTextNode(t),ty);
  else b.appendChild(document.createTextNode(t));
  scroll();
}
function streamEnd(b){
  if(ty){ty.remove();ty=null;}
}

function toolCard(id,name,args){
  const row=document.createElement('div');row.className='tool';
  row.appendChild(mk('span','tag '+(id?'rw':'ro'),name));
  row.appendChild(mk('code','',truncate(args,500)));
  if(id){
    const acts=mk('span','acts');
    const no=mk('button','no','Rechazar');
    const ok=mk('button','ok','Aprobar');
    ok.onclick=()=>decide(id,'accept',row);
    no.onclick=()=>decide(id,'deny',row,true);
    acts.append(no,ok);
    row.appendChild(acts);
  }else{
    const st=mk('span','st running','ejecutando…');
    row.appendChild(st);
  }
  pend.appendChild(row);
  scroll();
  return row;
}
function toolOut(row,text){
  const d=document.createElement('details');d.className='out';
  d.appendChild(mk('summary','','salida de la herramienta'));
  d.appendChild(mk('pre','',truncate(text,3000)));
  (row||pend).appendChild(d);
  scroll();
}
async function decide(id,action,row){
  try{await fetch('/api/pending/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});}catch(e){}
  row.replaceChildren(mk('span','tag ro','tool'),mk('span','st',action==='accept'?'ejecutando…':'rechazada'));
}

function autogrow(){
  inp.style.height='auto';
  inp.style.height=Math.min(inp.scrollHeight,180)+'px';
  sendbtn.disabled=busy||!inp.value.trim().length;
}

async function send(){
  const text=inp.value.trim();
  if(!text||busy)return;
  busy=true;sendbtn.disabled=true;inp.value='';inp.style.height='auto';
  appendMsg(text,'user');
  history.push({role:'user',content:text});

  const out=streamStart();
  let answer='',lastToolRow=null,curReason=null;
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session,messages:history,text})});
    if(!res.ok){streamEnd(out);out.textContent='error HTTP '+res.status;finish(busy);return;}
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))!==-1){
        const block=buf.slice(0,i);buf=buf.slice(i+2);
        for(const line of block.split('\n')){
          if(!line.startsWith('data: '))continue;
          let ev;try{ev=JSON.parse(line.slice(6));}catch(e){continue;}
          switch(ev.type){
            case 'token':streamToken(out,ev.text||'');answer+=ev.text||'';break;
            case 'reason':
              if(!curReason)curReason=bubble('assistant','reason');
              curReason.textContent+=ev.text||'';scroll();break;
            case 'tool':lastToolRow=toolCard(ev.id||null,ev.name||'tool',ev.args||'');break;
            case 'toolout':toolOut(lastToolRow,ev.text||'');break;
            case 'error':streamEnd(out);bubble('assistant','err').textContent='error: '+(ev.text||'');break;
            case 'done':
              session=session||ev.id;
              history.push({role:'assistant',content:answer});
              streamEnd(out);break;
          }
        }
      }
    }
  }catch(e){
    streamEnd(out);
    bubble('assistant','err').textContent='error de red: '+e.message;
  }
  busy=false;sendbtn.disabled=false;autogrow();inp.focus();
}

async function boot(){
  try{
    const [m,i]=await Promise.all([
      fetch('/api/model').then(r=>r.json()),
      fetch('/api/info').then(r=>r.json())
    ]);
    modelEl.textContent=m.model||'?';
    if(i.cwd){cwdEl.textContent=i.cwd;cwdEl.hidden=false;}
    statusEl.className='dot '+(i.tools?'ok':'err');
    statusEl.title=i.tools?'conectado · herramientas activas':'herramientas desactivadas';
  }catch(e){
    statusEl.className='dot err';
    statusEl.title='sin conexión';
    modelEl.textContent='sin conexión';
  }
}

function submit(ev){
  if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();send();}
}
inp.addEventListener('keydown',submit);
inp.addEventListener('input',autogrow);
sendbtn.addEventListener('click',send);
autogrow();
boot();
inp.focus();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAX</title>
<style>
:root{--bg:#0f1115;--fg:#e6e6e6;--dim:#8b93a7;--accent:#22c55e;--user:#818cf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;height:100vh;display:flex;flex-direction:column}
header{padding:10px 18px;border-bottom:1px solid #1f2430;display:flex;align-items:center;gap:14px}
header b{color:var(--accent);font-size:16px}
header span{font-size:12px;color:var(--dim)}
#log{flex:1;overflow-y:auto;padding:14px 18px}
.inner{max-width:920px;margin:0 auto}
.msg{margin:14px 0;white-space:pre-wrap;word-break:break-word}
.msg .who{font-weight:bold;color:var(--dim);display:block;font-size:12px;margin-bottom:2px;text-transform:lowercase}
.msg.user .who{color:var(--user)}
.msg.assistant .who{color:var(--accent)}
.msg.reason{color:var(--dim);font-style:italic}
.msg .stream-cursor{animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
pre.out{background:#141922;border:1px solid #1f2430;padding:10px;border-radius:8px;overflow:auto;max-height:320px;color:#c9d6ea;margin:6px 0;font-size:13px;line-height:1.4;white-space:pre}
#pending{max-width:920px;margin:0 auto;padding:0 18px 8px;display:flex;flex-direction:column;gap:8px}
.tool{display:flex;gap:10px;align-items:center;background:#161b26;border:1px solid #334155;padding:8px 12px;border-radius:8px;font-size:13px}
.tool .tag{background:#334155;color:#fbbf24;border-radius:4px;padding:2px 8px;font-weight:bold;font-size:11px;white-space:nowrap}
.tool code{color:#e2e8f0;overflow-wrap:anywhere;flex:1;font-size:12px}
.tool button{border:1px solid #334155;background:transparent;color:var(--fg);border-radius:6px;padding:4px 14px;cursor:pointer;font:inherit;font-size:12px}
.tool button.ok:hover{background:#14532d;border-color:#22c55e}
.tool button.no:hover{background:#7f1d1d;border-color:#ef4444}
.tool .run{color:#22c55e}
.chip{background:#161b26;border:1px solid #1f2430;border-radius:8px;padding:6px 10px;font-size:12px;color:var(--dim)}
#inputbar{display:flex;gap:8px;padding:12px 18px;max-width:920px;width:100%;margin:0 auto}
#input{flex:1;background:#141922;border:1px solid #263041;color:var(--fg);border-radius:8px;padding:10px 12px;font:inherit;outline:none}
#input:focus{border-color:var(--accent)}
#send{background:var(--accent);border:0;border-radius:8px;padding:0 22px;font-weight:bold;cursor:pointer;color:#052e16;font:inherit}
#send:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<header><b>MAX</b><span id="model">conectando…</span></header>
<div id="log"><div class="inner" id="stream"></div></div>
<div id="pending"></div>
<div id="inputbar">
  <input id="input" autocomplete="off" placeholder="escribe un mensaje… (Enter para enviar, Shift+Enter nueva línea)">
  <button id="send">Enviar</button>
</div>
<script>
const stream=document.getElementById('stream'),pend=document.getElementById('pending'),
      inp=document.getElementById('input'),sendbtn=document.getElementById('send'),modelEl=document.getElementById('model');
let session=null, busy=false;
const history=[];

fetch('/api/model').then(r=>r.json()).then(d=>{modelEl.textContent='modelo: '+d.model}).catch(()=>{});

function addMsg(who,text,cls,pre){
  const box=document.createElement('div');
  box.className='msg '+cls;
  if(who){const w=document.createElement('span');w.className='who';w.textContent=who;box.appendChild(w);}
  if(pre){const el=document.createElement('pre');el.className='out';el.textContent=text;box.appendChild(el);}
  else box.appendChild(document.createTextNode(text));
  stream.appendChild(box);scroll();
  return box;
}
function addStreamMsg(who){
  const box=document.createElement('div');
  box.className='msg assistant';
  const w=document.createElement('span');w.className='who';w.textContent=who;
  const hint=document.createElement('span');hint.className='stream-cursor';hint.textContent='▍';
  box.appendChild(w);box.appendChild(hint);
  stream.appendChild(box);scroll();
  return {box,hint};
}
function addToolCard(id,name,args){
  const row=document.createElement('div');row.className='tool';
  row.innerHTML='<span class="tag">'+name+'</span>';
  const code=document.createElement('code');code.textContent=args;row.appendChild(code);
  if(id){
    const ok=document.createElement('button');ok.className='ok';ok.textContent='Aprobar';
    const no=document.createElement('button');no.className='no';no.textContent='Rechazar';
    ok.onclick=()=>decide(id,'accept',row);
    no.onclick=()=>decide(id,'deny',row,true);
    row.appendChild(ok);row.appendChild(no);
  }else{
    const s=document.createElement('span');s.className='run';s.textContent='ejecutando…';row.appendChild(s);
  }
  pend.appendChild(row);scroll();
  return row;
}
async function decide(id,action,row,closed){
  try{await fetch('/api/pending/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});}
  catch(e){}
  row.innerHTML='<span class="tag">tool</span><span class="run">'+(closed?'rechazada':'ejecutando…')+'</span><button style="visibility:hidden" disabled>x</button>';
}
function scroll(){stream.parentElement.scrollTop=stream.parentElement.scrollHeight;}
function cleanCursor(m){if(m.hint)m.hint.remove();}
function finishStream(m){if(m.hint){m.hint.remove();}}

async function send(){
  const text=inp.value.trim();if(!text||busy)return;
  busy=true;sendbtn.disabled=true;inp.value='';scroll();
  addMsg('tú',text,'user');
  history.push({role:'user',content:text});

  const out=addStreamMsg('max');
  let answer='';
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session,messages:history,text})});
    if(!res.ok){addMsg('','error HTTP '+res.status,'assistant',true);finishStream(out);busy=false;sendbtn.disabled=false;return;}
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    const proc={tokens:false,reason:false};
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))!==-1){
        const block=buf.slice(0,i);buf=buf.slice(i+2);
        for(const line of block.split('\n')){
          if(!line.startsWith('data: '))continue;
          let ev;try{ev=JSON.parse(line.slice(6));}catch(e){continue;}
          switch(ev.type){
            case 'token':
              if(!proc.tokens){cleanCursor(out);proc.tokens=true;}
              out.box.appendChild(document.createTextNode(ev.text||''));
              answer+=ev.text||'';scroll();break;
            case 'reason':
              if(!proc.reason){addMsg('max (pensando)','','reason');proc.reason=true;}
              const last=stream.lastElementChild;last.textContent+=ev.text||'';scroll();break;
            case 'tool':
              addToolCard(ev.id||null,ev.name||'tool',ev.args||'');break;
            case 'toolout':
              addMsg('','','dim');addMsg('salida de herramienta',ev.text||'','assistant',true);break;
            case 'error':
              addMsg('','error: '+(ev.text||''),'assistant');finishStream(out);break;
            case 'done':
              session=session||ev.id;history.push({role:'assistant',content:answer});finishStream(out);break;
          }
        }
      }
    }
  }catch(e){
    addMsg('','error de red: '+e.message,'assistant');finishStream(out);
  }
  busy=false;sendbtn.disabled=false;inp.focus();
}

function submit(ev){if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();send();}}
inp.addEventListener('keydown',submit);
sendbtn.addEventListener('click',send);
inp.focus();
</script>
</body>
</html>
